[project]
name = "dhwani-bodhi-api"
version = "0.1.0"
description = "Dhwani-Bodhi: misconception-level foundational learning diagnostics (API + workers)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pyjwt>=2.8",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "av>=12.0",
  "anthropic>=0.40",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Real acoustic model (Wav2Vec2-CTC). Heavy: install on speech workers only.
speech = ["torch>=2.3", "transformers>=4.41"]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# B008: `Depends(...)` / `File(...)` in argument defaults is the FastAPI idiom.
ignore = ["B008"]
