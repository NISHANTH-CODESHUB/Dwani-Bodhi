# On-phone numeracy: Cheenu says a number, the child taps it among 4 options. Every distractor is
# diagnostic (guide §6.3.1): reversal (47→74), zero placement (340→304), concatenation (340→3040).
- id: m.tap.7
  type: tap_number
  grade: 1
  skills: [M1]
  prompt_hi: "Touch seven"
  answer: "7"
  options: [{value: "7"}, {value: "1"}, {value: "9"}, {value: "4"}]
