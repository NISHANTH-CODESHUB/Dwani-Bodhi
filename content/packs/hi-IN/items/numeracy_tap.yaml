# Comparison: picking the number with the larger *units* digit reveals NUM_UNITS_COMPARE.
- id: m.cmp.29_31
  type: tap_compare
  grade: 1
  skills: [M4, M5]
  prompt_hi: "Which number is bigger?"
  answer: "31"
  options: [{value: "29", probe: NUM_UNITS_COMPARE}, {value: "31"}]
- id: m.cmp.56_65
