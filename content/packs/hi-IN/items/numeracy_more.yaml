# More on-phone numeracy (EGMA subtasks). Every distractor reflects a typical early-grade error.
#
# tap_count — counting objects: `text` holds the objects (shown in rows of five, like a ten-frame),
#   distractors are the classic counting slips: one less (skipped an object), one more (counted one twice).
# tap_missing — number patterns: `text` is the sequence with "__" for the gap. Distractors: the
#   neighbour of the gap (copied the last number), off-by-ten, and concatenation/reversal where relevant.

